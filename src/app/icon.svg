<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Đậu</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <!-- Đậm hơn bảng màu pastel của trang: ở 16px trên thanh tab nền trắng,
           màu quá nhạt sẽ biến mất hoàn toàn. -->
      <stop offset="0" stop-color="#f27fae"/>
      <stop offset="0.55" stop-color="#f9a97f"/>
      <stop offset="1" stop-color="#7fb8f2"/>
    </linearGradient>
    <!-- Khoét một hình tròn ra khỏi hình bầu dục để tạo vết lõm của hạt đậu.
         Khối đặc đọc rõ hơn hẳn ở 16px so với nét vẽ mảnh. -->
    <mask id="bean">
      <rect width="32" height="32" fill="black"/>
      <ellipse cx="16.4" cy="15.8" rx="8.3" ry="11"
               transform="rotate(-38 16.4 15.8)" fill="white"/>
      <circle cx="6.2" cy="23.2" r="5.9" fill="black"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect width="32" height="32" fill="#fff" mask="url(#bean)"/>
</svg>
